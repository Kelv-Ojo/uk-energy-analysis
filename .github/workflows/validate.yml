name: Validate analysis
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip check
      - run: python ci_validate.py
      - name: Check target definitions and source keys
        run: |
          python src/reconcile_targets.py
          python src/test_target_reconciliation.py
      - name: Build and verify visual gallery
        run: |
          python src/build_visual_gallery.py
          python src/render_visual_gallery.py
          python src/check_visual_gallery.py
      - name: Check chronological forecast isolation
        run: |
          python -m pip install -r forecasting/requirements.txt
          python forecasting/backtest.py
          python forecasting/check_results.py
          python forecasting/error_bands.py
          python forecasting/test_error_bands.py
          python forecasting/test_no_lookahead.py
      - name: Record resolved dependency versions
        run: python -m pip freeze
