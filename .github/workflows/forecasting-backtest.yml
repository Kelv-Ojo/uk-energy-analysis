name: Validate chronological backtest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: forecasting/requirements.txt
      - run: python -m pip install -r forecasting/requirements.txt
      - run: python forecasting/check_results.py
      - run: python forecasting/backtest.py
      - run: python forecasting/check_results.py
